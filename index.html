<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>遺構管理台帳</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Sans','Meiryo',sans-serif;font-size:15px;background:#f4f4f4;color:#222}

header{background:#2c5f8a;color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:8px}
header h1{font-size:16px;font-weight:bold;white-space:nowrap}
.header-btns{display:flex;gap:6px;flex-wrap:wrap}

.btn{padding:6px 10px;border:none;border-radius:5px;cursor:pointer;font-size:13px;font-weight:bold}
.btn-white{background:#fff;color:#2c5f8a}
.btn-green{background:#2ecc71;color:#fff}
.btn-red{background:#e74c3c;color:#fff}
.btn-orange{background:#e67e22;color:#fff}
.btn-blue{background:#3498db;color:#fff}
.btn-gray{background:#888;color:#fff}
.btn-navy{background:#1a3f60;color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}

.site-bar{background:#152a3e;padding:8px 12px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #2c5f8a}
.site-bar label{font-size:12px;color:#7eb8e0;white-space:nowrap;font-weight:bold}
.site-bar input{flex:1;padding:6px 8px;font-size:13px;border:1px solid #2c5f8a;border-radius:4px;background:#0d1f2e;color:#fff}

.tabs{display:flex;background:#1a3f60;position:sticky;top:52px;z-index:99}
.tab{flex:1;padding:10px 4px;text-align:center;color:#aad;cursor:pointer;font-size:13px;border-bottom:3px solid transparent}
.tab.active{color:#fff;border-bottom:3px solid #4fc3f7;font-weight:bold}
.tab-badge{display:inline-block;background:#4fc3f7;color:#1a3f60;border-radius:10px;padding:0 6px;font-size:11px;margin-left:3px}

.panel{display:none;padding:12px}
.panel.active{display:block}

.type-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.type-tab{padding:5px 12px;border-radius:4px;font-size:13px;font-weight:bold;cursor:pointer;background:#fff;border:2px solid #2c5f8a;color:#2c5f8a}
.type-tab.active{background:#2c5f8a;color:#fff}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form-group{display:flex;flex-direction:column;gap:3px}
.form-group.full{grid-column:1/-1}
label{font-size:12px;color:#555;font-weight:bold}
select,input[type=text],input[type=number],input[type=date],textarea{
  width:100%;padding:8px;border:1px solid #ccc;border-radius:5px;
  font-size:15px;background:#fff;-webkit-appearance:none
}
input[type=date]{font-size:14px}
textarea{height:72px;resize:vertical}

/* 調査状況：チェック＋日付の行 */
.status-row{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px;
  padding:8px;background:#fff;border:1px solid #ccc;border-radius:5px;
}
.status-row label.chk-label{font-size:13px;color:#222;display:flex;align-items:center;gap:6px;font-weight:bold}
.status-row input[type=checkbox]{width:18px;height:18px;accent-color:#2c5f8a;flex-shrink:0}
.status-row .date-wrap{display:flex;flex-direction:column;gap:2px}
.status-row .date-wrap label{font-size:11px;color:#777;font-weight:normal}
.status-row .date-wrap input{padding:5px 7px;font-size:13px}

.section-hd{
  display:flex;align-items:center;justify-content:space-between;
  background:#2c5f8a;color:#fff;padding:9px 12px;
  border-radius:6px;margin:10px 0 6px;cursor:pointer;user-select:none
}
.section-hd:hover{background:#1a4f70}
.section-title{font-weight:bold;font-size:14px}
.section-arrow{font-size:13px;transition:transform .2s}
.section-arrow.open{transform:rotate(90deg)}
.section-body{display:none;margin-bottom:4px}
.section-body.open{display:block}

.save-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.save-btns .btn{padding:12px;font-size:14px}
.notice{color:#888;font-size:12px;margin-top:6px;text-align:center}

/* 写真エリア */
.photo-area{padding:0;margin-top:4px}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:8px}
.photo-card{position:relative;border-radius:6px;overflow:hidden;background:#e8f0f7;border:1px solid #c0d4e8}
.photo-card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;cursor:pointer}
.photo-card .photo-caption{font-size:11px;padding:3px 5px;background:rgba(0,0,0,.55);color:#fff;position:absolute;bottom:0;left:0;right:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photo-card .photo-del{position:absolute;top:3px;right:3px;background:rgba(231,76,60,.85);color:#fff;border:none;border-radius:3px;padding:1px 6px;font-size:12px;cursor:pointer}
.photo-card .photo-edit-btn{position:absolute;top:3px;left:3px;background:rgba(52,152,219,.85);color:#fff;border:none;border-radius:3px;padding:1px 6px;font-size:12px;cursor:pointer}
.photo-add-area{border:2px dashed #2c5f8a;border-radius:6px;padding:14px;text-align:center;color:#2c5f8a;font-size:13px;font-weight:bold;cursor:pointer;background:#eaf3fb}
.photo-add-area:hover{background:#d0e8f5}

/* 一覧 */
.action-bar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.count-badge{background:#2c5f8a;color:#fff;padding:4px 10px;border-radius:12px;font-size:13px}
.search-box{flex:1;min-width:180px;padding:7px 10px;border:1px solid #ccc;border-radius:5px;font-size:13px}
.list-table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:700px}
th{background:#2c5f8a;color:#fff;padding:7px 6px;text-align:left;white-space:nowrap;cursor:pointer;user-select:none}
th:hover{background:#1a4f70}
th.sort-asc::after{content:' ↑'}
th.sort-desc::after{content:' ↓'}
td{padding:6px;border-bottom:1px solid #ddd;vertical-align:top}
tr:hover td{background:#f0f7ff}
tr.selected td{background:#ddeeff}
.edit-btn{background:#3498db;color:#fff;border:none;border-radius:3px;padding:3px 8px;cursor:pointer;font-size:12px}
.del-btn{background:#e74c3c;color:#fff;border:none;border-radius:3px;padding:3px 8px;cursor:pointer;font-size:12px}
.bool-ok{color:#27ae60;font-weight:bold}
.bool-no{color:#bbb}
.photo-cnt{background:#3498db;color:#fff;border-radius:8px;padding:1px 6px;font-size:11px}
.memo-cell{white-space:pre-wrap;max-width:200px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* マスター設定 */
.master-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.master-item{display:flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid #ccc;border-radius:6px;background:#fff}
.master-item input{padding:6px 8px;border:1px solid #ccc;border-radius:4px;font-size:13px}
.master-item .pfx{width:64px;font-family:monospace}
.master-item .nm{flex:1}
.drag-handle{color:#aaa;cursor:grab;font-size:18px;padding:0 2px}

/* ライトボックス */
.lightbox{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center}
.lightbox.open{display:flex}
.lightbox img{max-width:93vw;max-height:93vh;object-fit:contain;border-radius:4px}
.lb-close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;border:none;cursor:pointer;font-size:20px}

/* 手書きモーダル */
.draw-modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:1000;background:rgba(0,0,0,0.85);flex-direction:column}
.draw-modal.open{display:flex}
.draw-toolbar{background:#1a3f60;padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.draw-toolbar label{color:#fff;font-size:12px}
.draw-toolbar input[type=color]{width:36px;height:30px;border:none;border-radius:4px;padding:0;cursor:pointer}
.draw-toolbar input[type=range]{width:80px}
.draw-canvas-wrap{flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#222}
#drawCanvas{touch-action:none;cursor:crosshair;max-width:100%;max-height:100%}
.draw-actions{background:#1a3f60;padding:8px 10px;display:flex;gap:8px;justify-content:flex-end}

/* トースト */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(6px);background:#152a3e;color:#fff;padding:9px 18px;border-radius:8px;font-size:13px;z-index:400;opacity:0;pointer-events:none;transition:all .22s;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 印刷 */
@media print{
  header,.tabs,.type-tabs,.action-bar,.save-btns,.photo-area,.draw-modal,.toast,.site-bar{display:none!important}
  body{background:#fff;font-size:11pt}
  .panel{display:block!important;padding:0}
  #panel-list{display:block!important}
  .list-table-wrap{overflow:visible}
  table{min-width:0}
  @page{margin:15mm}
}
.hidden{display:none!important}
.sep{border:none;border-top:1px solid #e0e8f0;margin:10px 0}
</style>
</head>
<body>

<header>
  <h1>🏛 遺構管理台帳</h1>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
    <div class="header-btns">
      <button class="btn btn-white" id="exportJsonBtn">JSON保存</button>
      <button class="btn btn-white" id="importJsonBtn">JSON読込</button>
      <button class="btn btn-orange" id="exportCsvBtn">CSV出力</button>
      <button class="btn btn-white" onclick="window.print()">🖨 印刷</button>
    </div>
    <div id="autoSaveStatus" style="font-size:11px;color:#aad">自動保存：未保存</div>
  </div>
</header>

<div class="site-bar">
  <label>遺跡名・調査区</label>
  <input type="text" id="siteNameInput" placeholder="例：○○遺跡 A区">
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('input')">入力・編集</div>
  <div class="tab" onclick="switchTab('list')">一覧 <span class="tab-badge" id="tabCount">0</span></div>
  <div class="tab" onclick="switchTab('master')">種別設定</div>
</div>

<!-- ===== 入力タブ ===== -->
<div class="panel active" id="panel-input">
  <div class="type-tabs" id="typeTabs"></div>

  <!-- 基本情報 -->
  <div class="section-hd" onclick="toggleSection('sec-basic')">
    <span class="section-title">📋 基本情報</span>
    <span class="section-arrow open" id="arr-sec-basic">▶</span>
  </div>
  <div class="section-body open" id="sec-basic">
    <div class="form-grid" id="fieldBasic"></div>
  </div>

  <!-- 調査状況 -->
  <div class="section-hd" onclick="toggleSection('sec-status')">
    <span class="section-title">✅ 調査状況</span>
    <span class="section-arrow open" id="arr-sec-status">▶</span>
  </div>
  <div class="section-body open" id="sec-status">
    <div id="fieldStatus"></div>
  </div>

  <!-- 記録・所見 -->
  <div class="section-hd" onclick="toggleSection('sec-notes')">
    <span class="section-title">📝 記録・所見</span>
    <span class="section-arrow open" id="arr-sec-notes">▶</span>
  </div>
  <div class="section-body open" id="sec-notes">
    <div class="form-grid" id="fieldNotes"></div>
  </div>

  <!-- 写真 -->
  <div class="section-hd" onclick="toggleSection('sec-photo')">
    <span class="section-title">📷 写真</span>
    <span class="section-arrow open" id="arr-sec-photo">▶</span>
  </div>
  <div class="section-body open" id="sec-photo">
    <div class="photo-area">
      <div class="photo-grid" id="photoGrid"></div>
      <div class="photo-add-area" id="photoAddArea">＋ クリックまたはドロップで写真を追加</div>
    </div>
  </div>

  <div class="save-btns">
    <button class="btn btn-green" id="saveBtn">💾 保存する</button>
    <button class="btn btn-blue" id="newFromFormBtn">＋ 別レコードとして保存</button>
  </div>
  <div style="text-align:center;margin-top:6px;display:flex;gap:8px;justify-content:center">
    <button class="btn btn-gray" id="resetBtn" style="padding:8px 20px">リセット</button>
    <button class="btn btn-red"  id="delBtn"   style="padding:8px 20px">🗑 削除</button>
    <button class="btn btn-navy" id="dupBtn"   style="padding:8px 20px">複製</button>
  </div>
  <div class="notice" id="formStatus">未選択 — 「一覧」からレコードを選択するか、新規入力してください</div>
</div>

<!-- ===== 一覧タブ ===== -->
<div class="panel" id="panel-list">
  <div class="type-tabs" id="typeTabsList"></div>
  <div class="action-bar">
    <span class="count-badge" id="listCount">0件</span>
    <input type="search" class="search-box" id="searchInput" placeholder="遺構番号・性格・遺物・備考などで絞り込み…">
    <button class="btn btn-white" id="addBtn" style="border:1px solid #ccc">＋ 新規追加</button>
    <button class="btn btn-white" id="clearSearch" style="border:1px solid #ccc">✕ クリア</button>
  </div>
  <div class="list-table-wrap">
    <table id="dataTable">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<!-- ===== 種別設定タブ ===== -->
<div class="panel" id="panel-master">
  <p style="font-size:13px;color:#555;margin-bottom:10px">
    遺構種別を追加・削除・編集できます。<br>
    <span style="color:#c0392b;font-size:12px">※ 種別を削除するとその種別のデータも削除されます。</span>
  </p>
  <div class="master-list" id="masterList"></div>
  <button class="btn btn-blue" id="addTypeBtn" style="width:100%;padding:10px;margin-bottom:12px">＋ 種別を追加</button>
  <hr class="sep">
  <button class="btn btn-green" id="saveMasterBtn" style="width:100%;padding:12px;font-size:14px">✅ 設定を保存</button>
  <div class="notice" style="margin-top:8px">保存するとタブと入力フォームに反映されます。</div>
</div>

<!-- ライトボックス -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose">✕</button>
  <img id="lbImg" src="" alt="">
</div>

<!-- 手書きモーダル -->
<div class="draw-modal" id="drawModal">
  <div class="draw-toolbar">
    <label>🎨 <input type="color" id="drawColor" value="#e74c3c"></label>
    <label>太さ <input type="range" id="drawSize" min="2" max="40" value="6" style="width:70px"></label>
    <button class="btn btn-white" onclick="setDrawMode('pen')"    id="btnPen"    style="padding:5px 10px;font-size:13px">✏️ ペン</button>
    <button class="btn btn-gray"  onclick="setDrawMode('eraser')" id="btnEraser" style="padding:5px 10px;font-size:13px">🧹 消しゴム</button>
    <button class="btn btn-gray"  onclick="undoDraw()"  style="padding:5px 10px;font-size:13px">↩ 戻す</button>
    <button class="btn btn-red"   onclick="clearDraw()" style="padding:5px 10px;font-size:13px">🗑 全消去</button>
  </div>
  <div class="draw-canvas-wrap">
    <canvas id="drawCanvas"></canvas>
  </div>
  <div class="draw-actions">
    <button class="btn btn-gray"  onclick="closeDrawModal()" style="padding:10px 20px">キャンセル</button>
    <button class="btn btn-green" onclick="saveDrawing()"    style="padding:10px 20px">💾 保存</button>
  </div>
</div>

<input type="file" id="jsonFileInput"   accept=".json"    class="hidden">
<input type="file" id="photoFileInput"  accept="image/*"  multiple class="hidden">
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════
// IndexedDB
// ═══════════════════════════════════════════════════
const DB_NAME="arch-ledger-v2",DB_VER=1;
let db;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains("records")) d.createObjectStore("records",{keyPath:"_rowId",autoIncrement:true});
      if(!d.objectStoreNames.contains("photos"))  d.createObjectStore("photos",{keyPath:"id",autoIncrement:true});
      if(!d.objectStoreNames.contains("meta"))    d.createObjectStore("meta",{keyPath:"key"});
    };
    r.onsuccess=e=>{db=e.target.result;res(db)};
    r.onerror=()=>rej(r.error);
  });
}
function idbGet(s,k){return new Promise((res,rej)=>{const r=db.transaction(s,"readonly").objectStore(s).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idbPut(s,v){return new Promise((res,rej)=>{const r=db.transaction(s,"readwrite").objectStore(s).put(v);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idbDel(s,k){return new Promise((res,rej)=>{const r=db.transaction(s,"readwrite").objectStore(s).delete(k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function idbAll(s){return new Promise((res,rej)=>{const r=db.transaction(s,"readonly").objectStore(s).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function getMeta(k,def){const r=await idbGet("meta",k);return r?r.value:def}
async function setMeta(k,v){await idbPut("meta",{key:k,value:v})}

// ═══════════════════════════════════════════════════
// Schema
// ═══════════════════════════════════════════════════
const DEFAULT_TYPES=[
  {prefix:"SI",name:"住居"},
  {prefix:"SE",name:"井戸"},
  {prefix:"SD",name:"溝"},
  {prefix:"SK",name:"土坑"},
  {prefix:"SH",name:"ピット"},
];

// 調査状況の順番（着手→断面→土注→SP観測→完掘→3D）
const STATUS_FIELDS=[
  "着手","断面","土注","SP観測","完掘","3D"
];

// 基本情報フィールド（出土遺物を含む）
const FIELDS_BASIC=[
  ["遺構番号","select_num"],   // 1～100のselect
  ["位置","text"],
  ["検出面","text"],
  ["性格","text"],
  ["規模","text"],
  ["主軸方位","text"],
  ["標高","text"],
  ["年代(構築・廃絶)","text"],
  ["重複","text"],
  ["出土遺物","textarea"],     // 基本情報に移動
];

// 記録・所見フィールド
const FIELDS_NOTES=[
  ["形状等","textarea"],
  ["土層","textarea"],
  ["所見","textarea"],
  ["付帯施設","textarea"],
  ["遺物出土状況","textarea"],
  ["備考","textarea"],
];

// 全フィールド（保存・収集用）
function allFields(){
  const a=[...FIELDS_BASIC];
  STATUS_FIELDS.forEach(n=>a.push([n,"bool"],[`${n}_日付`,"date"]));
  FIELDS_NOTES.forEach(f=>a.push(f));
  return a;
}

// ═══════════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════════
let st={types:[],activeType:"",records:{},photos:{},selectedId:null,dirty:false,filter:"",sortField:null,sortDir:"asc"};
let pendingPhotos=[];
function rowKey(type,id){return`${type}::${id}`}
function currentRows(){return st.records[st.activeType]||[]}
function nextId(type=st.activeType){return(st.records[type]||[]).reduce((m,r)=>Math.max(m,Number(r._rowId||0)),0)+1}
function nowText(){const d=new Date(),p=n=>String(n).padStart(2,"0");return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`}
function defaultRecord(type=st.activeType){
  const o={_rowId:nextId(type),_createdAt:nowText(),_updatedAt:nowText()};
  allFields().forEach(([n,k])=>o[n]=k==="bool"?false:"");
  return o;
}

// ═══════════════════════════════════════════════════
// Persist
// ═══════════════════════════════════════════════════
async function persist(){
  await setMeta("types",st.types);
  await setMeta("records",st.records);
  st.dirty=false;
  document.getElementById("autoSaveStatus").textContent="保存済："+nowText();
  showToast("保存しました");
}
async function loadAll(){
  st.types  =await getMeta("types",DEFAULT_TYPES);
  st.records=await getMeta("records",{});
  const sn  =await getMeta("siteName","");
  if(sn)document.getElementById("siteNameInput").value=sn;
  st.types.forEach(t=>{if(!st.records[t.name])st.records[t.name]=[]});
  if(st.types.length)st.activeType=st.types[0].name;
  const ap=await idbAll("photos");
  st.photos={};
  ap.forEach(p=>{if(!st.photos[p.rowKey])st.photos[p.rowKey]=[];st.photos[p.rowKey].push(p)});
}

// ═══════════════════════════════════════════════════
// UI helpers
// ═══════════════════════════════════════════════════
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[m])}
function showToast(msg,dur=2000){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),dur)}
function switchTab(id){

function renderFormFields(){
  // 基本情報
  const basic=document.getElementById("fieldBasic");basic.innerHTML="";
  FIELDS_BASIC.forEach(([name,kind])=>{
    const div=document.createElement("div");
    const isFull=kind==="textarea";
    div.className="form-group"+(isFull?" full":"");
    if(kind==="select_num"){
      const opts=Array.from({length:100},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join("");
      div.innerHTML=`<label>${esc(name)}</label><select data-field="${esc(name)}"><option value="">選択…</option>${opts}</select>`;
    }else if(kind==="textarea"){
      div.innerHTML=`<label>${esc(name)}</label><textarea data-field="${esc(name)}" placeholder="${esc(name)}を入力"></textarea>`;
    }else{
      div.innerHTML=`<label>${esc(name)}</label><input type="text" data-field="${esc(name)}" placeholder="${esc(name)}">`;
    }
    basic.appendChild(div);
  });

  // 調査状況（着手・断面・土注・SP観測・完掘・3D）各行にチェック＋日付
  const status=document.getElementById("fieldStatus");status.innerHTML="";
  STATUS_FIELDS.forEach(name=>{
    const dateField=`${name}_日付`;
    const row=document.createElement("div");
    row.className="status-row";
    row.innerHTML=`
      <label class="chk-label">
        <input type="checkbox" data-field="${esc(name)}">
        ${esc(name)}
      </label>
      <div class="date-wrap">
        <label>実施日</label>
        <input type="date" data-field="${esc(dateField)}">
      </div>`;
    status.appendChild(row);
  });

  // 記録・所見
  const notes=document.getElementById("fieldNotes");notes.innerHTML="";
  FIELDS_NOTES.forEach(([name])=>{
    const div=document.createElement("div");
    div.className="form-group full";
    div.innerHTML=`<label>${esc(name)}</label><textarea data-field="${esc(name)}" placeholder="${esc(name)}を入力"></textarea>`;
    notes.appendChild(div);
  });
}

function fillForm(record){
  allFields().forEach(([name,kind])=>{
    const el=document.querySelector(`[data-field="${CSS.escape(name)}"]`);
    if(!el)return;
    if(kind==="bool") el.checked=!!record[name];
    else el.value=record[name]??"";
  });
  document.getElementById("panel-input").dataset.rowId=record._rowId||"";
  document.getElementById("panel-input").dataset.createdAt=record._createdAt||nowText();
}

function loadForm(record,markDirty=true){
  fillForm(record);
  const rk=st.selectedId?rowKey(st.activeType,st.selectedId):"__new__";
  pendingPhotos=[];
  renderPhotoGrid(rk);
  document.getElementById("formStatus").textContent=
    st.selectedId?`編集中：${st.activeType} / ${record["遺構番号"]||"管理ID "+st.selectedId}`:"新規入力モード";
  if(markDirty)st.dirty=true;
}

function collectForm(){
  const pi=document.getElementById("panel-input");
  const obj={_rowId:Number(pi.dataset.rowId||nextId()),_createdAt:pi.dataset.createdAt||nowText(),_updatedAt:nowText()};
  allFields().forEach(([name,kind])=>{
    const el=document.querySelector(`[data-field="${CSS.escape(name)}"]`);
    if(!el)return;
    obj[name]=kind==="bool"?!!el.checked:el.value.trim();
  });
  return obj;
}

function renderPhotoGrid(rk){
  const all=[...(st.photos[rk]||[]),...pendingPhotos];
  const grid=document.getElementById("photoGrid");
  grid.innerHTML=all.map((p,i)=>`
    <div class="photo-card">
      <img src="${p.dataUrl}" alt="${esc(p.caption||"")}" data-li="${i}">
      ${p.caption?`<div class="photo-caption">${esc(p.caption)}</div>`:""}
      <button class="photo-edit-btn" data-idx="${i}" data-pend="${p.id==null?"1":"0"}" data-id="${p.id??""}">✏</button>
      <button class="photo-del"      data-idx="${i}" data-pend="${p.id==null?"1":"0"}" data-id="${p.id??""}">✕</button>
    </div>`).join("");
  grid.querySelectorAll("img[data-li]").forEach(img=>{img.onclick=()=>openLightbox(img.src)});
  grid.querySelectorAll(".photo-edit-btn").forEach(btn=>{
    btn.onclick=e=>{
      e.stopPropagation();
      const idx=Number(btn.dataset.idx),isPend=btn.dataset.pend==="1",dbId=Number(btn.dataset.id);
      const p=isPend?pendingPhotos[idx-(st.photos[rk]||[]).length]:(st.photos[rk]||[]).find(x=>x.id===dbId);
      if(p)openDrawModal(rk,p,isPend?null:dbId);
    };
  });
  grid.querySelectorAll(".photo-del").forEach(btn=>{
    btn.onclick=async e=>{
      e.stopPropagation();
      const idx=Number(btn.dataset.idx),isPend=btn.dataset.pend==="1",dbId=Number(btn.dataset.id);
      if(isPend){pendingPhotos.splice(idx-(st.photos[rk]||[]).length,1)}
      else{await idbDel("photos",dbId);st.photos[rk]=(st.photos[rk]||[]).filter(p=>p.id!==dbId)}
      renderPhotoGrid(rk);
    };
  });
}
async function handlePhotoFiles(files){
  for(const f of files){
    if(!f.type.startsWith("image/"))continue;
    const dataUrl=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)});
    pendingPhotos.push({dataUrl,caption:f.name.replace(/\.[^.]+$/,""),id:null});
  }
  const rk=st.selectedId?rowKey(st.activeType,st.selectedId):"__new__";
  renderPhotoGrid(rk);st.dirty=true;
}
function openLightbox(src){document.getElementById("lbImg").src=src;document.getElementById("lightbox").classList.add("open")}

// ═══════════════════════════════════════════════════
// 手書き
// ═══════════════════════════════════════════════════
let drawCtx=null,drawCanvas=null,isDrawing=false,drawMode="pen",drawHistory=[],drawTargetRk=null,drawTargetId=null,drawTargetIsPend=false,drawTargetPendIdx=-1;

function initCanvas(imgSrc){
  drawCanvas=document.getElementById("drawCanvas");
  drawCtx=drawCanvas.getContext("2d");
  const img=new Image();
  img.onload=()=>{
    const maxW=window.innerWidth,maxH=window.innerHeight-120;
    const scale=Math.min(maxW/img.width,maxH/img.height,1);
    drawCanvas.width=img.width*scale;drawCanvas.height=img.height*scale;
    drawCtx.drawImage(img,0,0,drawCanvas.width,drawCanvas.height);
    drawHistory=[drawCtx.getImageData(0,0,drawCanvas.width,drawCanvas.height)];
  };
  img.src=imgSrc;
}
function openDrawModal(rk,photoObj,dbId){
  drawTargetRk=rk;drawTargetId=dbId;
  drawTargetIsPend=dbId===null;
  if(drawTargetIsPend){drawTargetPendIdx=pendingPhotos.indexOf(photoObj)}
  document.getElementById("drawModal").classList.add("open");
  setDrawMode("pen");initCanvas(photoObj.dataUrl);setupDrawEvents();
}
function closeDrawModal(){document.getElementById("drawModal").classList.remove("open");removeDrawEvents()}
function setDrawMode(mode){
  drawMode=mode;
  document.getElementById("btnPen").className   =mode==="pen"    ?"btn btn-blue":"btn btn-gray";
  document.getElementById("btnEraser").className=mode==="eraser" ?"btn btn-blue":"btn btn-gray";
  document.getElementById("btnPen").style.cssText="padding:5px 10px;font-size:13px";
  document.getElementById("btnEraser").style.cssText="padding:5px 10px;font-size:13px";
}
function undoDraw(){if(drawHistory.length<=1)return;drawHistory.pop();drawCtx.putImageData(drawHistory[drawHistory.length-1],0,0)}
function clearDraw(){if(drawHistory.length>0){drawCtx.putImageData(drawHistory[0],0,0);drawHistory=[drawHistory[0]]}}
function getPos(e,canvas){
  const rect=canvas.getBoundingClientRect(),sx=canvas.width/rect.width,sy=canvas.height/rect.height;
  const src=e.touches?e.touches[0]:e;
  return{x:(src.clientX-rect.left)*sx,y:(src.clientY-rect.top)*sy};
}
function onDrawStart(e){e.preventDefault();isDrawing=true;const pos=getPos(e,drawCanvas);drawCtx.beginPath();drawCtx.moveTo(pos.x,pos.y)}
function onDrawMove(e){
  e.preventDefault();if(!isDrawing)return;
  const pos=getPos(e,drawCanvas),size=parseInt(document.getElementById("drawSize").value),color=document.getElementById("drawColor").value;
  if(drawMode==="eraser"){drawCtx.globalCompositeOperation="destination-out";drawCtx.lineWidth=size*3;drawCtx.strokeStyle="rgba(0,0,0,1)"}
  else{drawCtx.globalCompositeOperation="source-over";drawCtx.lineWidth=size;drawCtx.strokeStyle=color}
  drawCtx.lineCap="round";drawCtx.lineJoin="round";drawCtx.lineTo(pos.x,pos.y);drawCtx.stroke();
}
function onDrawEnd(e){if(!isDrawing)return;isDrawing=false;drawCtx.globalCompositeOperation="source-over";drawHistory.push(drawCtx.getImageData(0,0,drawCanvas.width,drawCanvas.height))}
function setupDrawEvents(){const c=document.getElementById("drawCanvas");c.addEventListener("mousedown",onDrawStart);c.addEventListener("mousemove",onDrawMove);c.addEventListener("mouseup",onDrawEnd);c.addEventListener("touchstart",onDrawStart,{passive:false});c.addEventListener("touchmove",onDrawMove,{passive:false});c.addEventListener("touchend",onDrawEnd)}
function removeDrawEvents(){const c=document.getElementById("drawCanvas");c.removeEventListener("mousedown",onDrawStart);c.removeEventListener("mousemove",onDrawMove);c.removeEventListener("mouseup",onDrawEnd);c.removeEventListener("touchstart",onDrawStart);c.removeEventListener("touchmove",onDrawMove);c.removeEventListener("touchend",onDrawEnd)}
async function saveDrawing(){
  const newDataUrl=document.getElementById("drawCanvas").toDataURL("image/jpeg",0.85);
  const rk=drawTargetRk;
  if(drawTargetIsPend){
    pendingPhotos[drawTargetPendIdx].dataUrl=newDataUrl;
  }else{
    const arr=st.photos[rk]||[];
    const p=arr.find(x=>x.id===drawTargetId);
    if(p){p.dataUrl=newDataUrl;await idbPut("photos",p)}
  }
  closeDrawModal();renderPhotoGrid(rk);st.dirty=true;showToast("手書き注記を保存しました");
}

// ═══════════════════════════════════════════════════
// Save / Delete / Duplicate
// ═══════════════════════════════════════════════════
async function saveCurrent(replaceSelected=true){
  const rows=currentRows(),obj=collectForm();
  const idx=rows.findIndex(r=>r._rowId===obj._rowId);
  if(replaceSelected&&idx>=0){rows[idx]=obj;st.selectedId=obj._rowId}
  else{obj._rowId=nextId();rows.push(obj);st.selectedId=obj._rowId}
  const rk=rowKey(st.activeType,st.selectedId);
  for(const p of pendingPhotos){
    const stored={rowKey:rk,dataUrl:p.dataUrl,caption:p.caption};
    const newId=await idbPut("photos",stored);stored.id=newId;
    if(!st.photos[rk])st.photos[rk]=[];st.photos[rk].push(stored);
  }
  pendingPhotos=[];
  await persist();renderAll();
  fillForm(structuredClone(obj));renderPhotoGrid(rk);
  document.getElementById("formStatus").textContent=`保存済：${st.activeType} / ${obj["遺構番号"]||"管理ID "+st.selectedId}`;
}
async function deleteSelected(){
  if(!st.selectedId)return;
  const rows=currentRows(),idx=rows.findIndex(r=>r._rowId===st.selectedId);
  if(idx<0)return;
  const row=rows[idx],label=row["遺構番号"]||`管理ID ${row._rowId}`;
  if(!confirm(`削除しますか？\n${st.activeType} / ${label}`))return;
  const rk=rowKey(st.activeType,st.selectedId);
  for(const p of(st.photos[rk]||[]))await idbDel("photos",p.id);
  delete st.photos[rk];rows.splice(idx,1);st.selectedId=null;
  await persist();renderAll();loadForm(defaultRecord(),false);
}
async function duplicateSelected(){
  const row=st.selectedId?currentRows().find(r=>r._rowId===st.selectedId):collectForm();
  if(!row)return;
  const copy=structuredClone(row);copy._rowId=nextId();copy._createdAt=nowText();copy._updatedAt=nowText();
  currentRows().push(copy);st.selectedId=copy._rowId;
  await persist();renderAll();loadForm(structuredClone(copy),false);
}

// ═══════════════════════════════════════════════════
// Table
// ═══════════════════════════════════════════════════
const TABLE_COLS=["遺構番号","位置","着手","断面","土注","SP観測","完掘","3D","検出面","性格","出土遺物","重複","備考"];
const BOOL_COLS=new Set(STATUS_FIELDS);

function visibleRows(){
  const rows=[...currentRows()].sort((a,b)=>{
    if(st.sortField){const va=a[st.sortField]??"",vb=b[st.sortField]??"";const c=String(va).localeCompare(String(vb),"ja");return st.sortDir==="asc"?c:-c}
    return(a._rowId||0)-(b._rowId||0);
  });
  const q=st.filter.trim().toLowerCase();
  return q?rows.filter(r=>Object.entries(r).some(([k,v])=>!String(k).startsWith("_")&&String(v??"").toLowerCase().includes(q))):rows;
}

function renderTable(){
  const head=document.getElementById("tableHead"),body=document.getElementById("tableBody");
  const ths=["#","写真",...TABLE_COLS].map((col,i)=>{
    if(i<2)return`<th>${esc(col)}</th>`;
    const sc=st.sortField===col?" sort-"+st.sortDir:"";
    return`<th class="${sc}" data-col="${esc(col)}">${esc(col)}</th>`;
  }).join("");
  head.innerHTML=`<tr>${ths}<th>操作</th></tr>`;
  head.querySelectorAll("th[data-col]").forEach(th=>{th.onclick=()=>{st.sortField===th.dataset.col?st.sortDir=st.sortDir==="asc"?"desc":"asc":(st.sortField=th.dataset.col,st.sortDir="asc");renderTable()}});
  const rows=visibleRows();
  document.getElementById("listCount").textContent=`${rows.length}件 / 全${currentRows().length}件`;
  if(!rows.length){body.innerHTML=`<tr><td colspan="${TABLE_COLS.length+4}" style="padding:24px;text-align:center;color:#aaa">データがありません</td></tr>`;return}
  body.innerHTML=rows.map(row=>{
    const rk=rowKey(st.activeType,row._rowId),cnt=(st.photos[rk]||[]).length;
    const tds=TABLE_COLS.map(col=>{
      const v=row[col];
      if(BOOL_COLS.has(col)){
        const dateVal=row[`${col}_日付`]||"";
        return`<td style="text-align:center"><span class="${v?"bool-ok":"bool-no"}">${v?"○":"－"}</span>${dateVal?`<br><span style="font-size:10px;color:#666">${esc(dateVal)}</span>`:""}`;
      }
      const isMemo=["出土遺物","形状等","土層","所見","付帯施設","遺物出土状況","備考"].includes(col);
      return`<td class="${isMemo?"memo-cell":""}">${esc(v??"")}</td>`;
    }).join("");
    return`<tr class="${st.selectedId===row._rowId?"selected":""}" data-id="${row._rowId}">
      <td style="color:#888;font-size:12px;font-weight:bold">${row._rowId}</td>
      <td>${cnt?`<span class="photo-cnt">📷 ${cnt}</span>`:`<span style="color:#ccc">－</span>`}</td>
      ${tds}
      <td><button class="edit-btn" data-id="${row._rowId}">編集</button> <button class="del-btn" data-id="${row._rowId}">削除</button></td>
    </tr>`;
  }).join("");
  body.querySelectorAll(".edit-btn").forEach(btn=>{btn.onclick=e=>{e.stopPropagation();const id=Number(btn.dataset.id);st.selectedId=id;const row=currentRows().find(r=>r._rowId===id);if(row){loadForm(structuredClone(row),false);switchTab("input");renderTable()}}});
  body.querySelectorAll(".del-btn").forEach(btn=>{btn.onclick=async e=>{e.stopPropagation();st.selectedId=Number(btn.dataset.id);await deleteSelected()}});
  body.querySelectorAll("tr[data-id]").forEach(tr=>{tr.onclick=()=>{const id=Number(tr.dataset.id);if(st.selectedId===id)return;st.selectedId=id;const row=currentRows().find(r=>r._rowId===id);if(row){loadForm(structuredClone(row),false);switchTab("input");renderTable()}}});
}

function renderMasterList(){

      <span class="drag-handle">⠿</span>

function collectMaster(){
  return[...document.querySelectorAll(".master-item")].map(item=>({prefix:item.querySelector('[data-f="prefix"]').value.trim(),name:item.querySelector('[data-f="name"]').value.trim()})).filter(t=>t.prefix&&t.name);
}

// ═══════════════════════════════════════════════════
// Import / Export
// ═══════════════════════════════════════════════════
function exportJson(){
  const blob=new Blob([JSON.stringify({types:st.types,records:st.records,siteName:document.getElementById("siteNameInput").value},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`遺構台帳_${nowText().replace(/[: ]/g,"-")}.json`;a.click();URL.revokeObjectURL(a.href);
}
function importJson(file){
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const p=JSON.parse(r.result);
      if(p.types)st.types=p.types;if(p.records)st.records=p.records;if(p.siteName)document.getElementById("siteNameInput").value=p.siteName;
      st.types.forEach(t=>{if(!st.records[t.name])st.records[t.name]=[]});
      if(!st.types.find(t=>t.name===st.activeType))st.activeType=st.types[0]?.name||"";
      st.selectedId=null;await persist();renderAll();loadForm(defaultRecord(),false);showToast("JSONを読み込みました");
    }catch{alert("JSONの読み込みに失敗しました")}
  };r.readAsText(file,"utf-8");
}
function exportCsv(){
  const af=allFields(),rows=visibleRows().sort((a,b)=>(a._rowId||0)-(b._rowId||0));
  const hdr=["管理ID",...af.map(f=>f[0]),"作成日時","更新日時"];
  const esc2=v=>{const s=String(v??"");return/[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const lines=[hdr.map(esc2).join(",")];
  rows.forEach(row=>lines.push([row._rowId,...af.map(([n,k])=>k==="bool"?(row[n]?"1":"0"):(row[n]??"")),row._createdAt??"",row._updatedAt??""].map(esc2).join(",")));
  const blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8;"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`${st.activeType}_台帳_${nowText().replace(/[: ]/g,"-")}.csv`;a.click();URL.revokeObjectURL(a.href);
}

function renderAll(){renderTypeTabs("typeTabs");renderTypeTabs("typeTabsList");renderTable();updateTabCount();renderMasterList()}

  renderFormFields();
  renderAll();
  loadForm(defaultRecord(),false);
  const saved=await getMeta("records",null);
  document.getElementById("autoSaveStatus").textContent=saved?"IndexedDBに保存済":"自動保存：未保存";
})();
</script>
